# Themed lock screen. Authentication uses Arch's hyprlock PAM stack.
source = ~/.config/hypr/hyprlock-theme.conf
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    color = $theme_background
}

label {
    monitor =
    text = $TIME
    color = $theme_text
    font_size = 72
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $theme_subtext
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 3
    inner_color = $theme_surface
    outer_color = $theme_accent
    check_color = $theme_blue
    fail_color = $theme_red
    font_color = $theme_text
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    rounding = 20
    dots_spacing = 0.25
    position = 0, -40
    halign = center
    valign = center
}
