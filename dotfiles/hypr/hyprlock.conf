# Catppuccin Mocha lock screen. Authentication uses Arch's hyprlock PAM stack.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    color = rgb(1e1e2e)
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 72
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(a6adc8)
    font_size = 18
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 3
    inner_color = rgb(313244)
    outer_color = rgb(cba6f7)
    check_color = rgb(89b4fa)
    fail_color = rgb(f38ba8)
    font_color = rgb(cdd6f4)
    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fade_on_empty = false
    rounding = 20
    dots_spacing = 0.25
    position = 0, -40
    halign = center
    valign = center
}
